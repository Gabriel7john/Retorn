<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retorn</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --card: #141414;
        --line: #262626;
        --tx: #f2f2f2;
        --mut: #8a8a8a;
        --red: #ff1a1a;
        --dred: #8b0000;
        --green: #3ddc84;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        padding: 24px 16px 48px;
      }
      .wrap {
        max-width: 860px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 2px solid;
        border-image: linear-gradient(
            90deg,
            var(--red),
            var(--dred) 40%,
            transparent
          )
          1;
      }
      h1 {
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      h1 span {
        color: var(--red);
      }
      h2 {
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--mut);
        margin-bottom: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .filtro {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--tx);
        background: #0f0f0f;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--red);
      }
      button {
        cursor: pointer;
      }
      button.pri {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
        font-weight: 600;
      }
      button.pri:hover {
        background: var(--dred);
        border-color: var(--dred);
      }
      button.sec:hover {
        border-color: var(--red);
      }
      .resumo {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      .resumo .card {
        margin: 0;
      }
      .resumo small {
        color: var(--mut);
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .resumo strong {
        display: block;
        font-size: 22px;
        margin-top: 2px;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      form {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
      }
      form .d {
        grid-column: span 2;
      }
      form .s {
        grid-column: span 1;
      }
      form button {
        grid-column: span 6;
      }
      .cat {
        margin-bottom: 10px;
      }
      .cat div:first-child {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .bar {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--dred), var(--red));
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 10px 6px;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      tr:first-child td {
        border-top: 0;
      }
      td.v {
        text-align: right;
        white-space: nowrap;
        font-weight: 600;
      }
      td.x {
        width: 32px;
        text-align: right;
      }
      .tag {
        font-size: 11px;
        color: var(--mut);
        display: block;
      }
      .del {
        background: none;
        border: 0;
        color: var(--mut);
        padding: 2px 6px;
      }
      .del:hover {
        color: var(--red);
      }
      .vazio {
        color: var(--mut);
        text-align: center;
        padding: 16px 0;
      }
      @media (max-width: 640px) {
        .resumo {
          grid-template-columns: 1fr;
        }
        form {
          grid-template-columns: 1fr 1fr;
        }
        form .d,
        form button {
          grid-column: span 2;
        }
        form .s {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>RETORN<span>.</span></h1>
        <div class="filtro">
          <input type="month" id="mes" aria-label="Mês" />
          <button class="sec" id="todos" type="button">Todos</button>
          <button class="sec" id="csv" type="button">Exportar CSV</button>
        </div>
      </header>

      <section class="resumo">
        <div class="card">
          <small>Entradas</small><strong class="pos" id="inc">R$ 0,00</strong>
        </div>
        <div class="card">
          <small>Saídas</small><strong class="neg" id="out">R$ 0,00</strong>
        </div>
        <div class="card">
          <small>Saldo</small><strong id="bal">R$ 0,00</strong>
        </div>
      </section>

      <section class="card">
        <h2>Nova transação</h2>
        <form id="f">
          <input
            class="d"
            id="desc"
            placeholder="Descrição"
            required
            maxlength="60"
          />
          <input
            class="s"
            id="val"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="Valor"
            required
          />
          <select class="s" id="tipo">
            <option value="saida">Saída</option>
            <option value="entrada">Entrada</option>
          </select>
          <select class="s" id="cat"></select>
          <input class="s" id="data" type="date" required />
          <button class="pri" type="submit">Adicionar</button>
        </form>
      </section>

      <section class="card">
        <h2>Gastos por categoria</h2>
        <div id="cats"></div>
      </section>

      <section class="card">
        <h2>Transações</h2>
        <table>
          <tbody id="lista"></tbody>
        </table>
      </section>
    </div>

    <script>
      const CATS = [
        "Alimentação",
        "Moradia",
        "Transporte",
        "Lazer",
        "Saúde",
        "Estudos",
        "Salário",
        "Outros",
      ];
      const $ = (s) => document.querySelector(s);
      const brl = (v) =>
        v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const hoje = new Date().toISOString().slice(0, 10);
      let tx = [];
      try {
        tx = JSON.parse(localStorage.getItem("fin_tx")) || [];
      } catch (e) {
        tx = [];
      }
      const save = () => {
        try {
          localStorage.setItem("fin_tx", JSON.stringify(tx));
        } catch (e) {}
      };

      $("#cat").innerHTML = CATS.map((c) => `<option>${c}</option>`).join("");
      $("#data").value = hoje;
      $("#mes").value = hoje.slice(0, 7);

      function render() {
        const m = $("#mes").value;
        const list = tx
          .filter((t) => !m || t.data.startsWith(m))
          .sort((a, b) => b.data.localeCompare(a.data));
        const sum = (tp) =>
          list.filter((t) => t.tipo === tp).reduce((s, t) => s + t.valor, 0);
        const inc = sum("entrada"),
          out = sum("saida"),
          bal = inc - out;
        $("#inc").textContent = brl(inc);
        $("#out").textContent = brl(out);
        const b = $("#bal");
        b.textContent = brl(bal);
        b.className = bal < 0 ? "neg" : "pos";

        const por = {};
        list
          .filter((t) => t.tipo === "saida")
          .forEach((t) => (por[t.cat] = (por[t.cat] || 0) + t.valor));
        const ord = Object.entries(por).sort((a, b) => b[1] - a[1]);
        $("#cats").innerHTML = ord.length
          ? ord
              .map(
                ([c, v]) =>
                  `<div class="cat"><div><span>${esc(c)}</span><span>${brl(v)}</span></div><div class="bar"><i style="width:${((v / out) * 100).toFixed(1)}%"></i></div></div>`,
              )
              .join("")
          : '<div class="vazio">Sem saídas no período.</div>';

        $("#lista").innerHTML = list.length
          ? list
              .map((t) => {
                const d = t.data.split("-").reverse().join("/");
                const sinal = t.tipo === "entrada" ? "+" : "-";
                return `<tr><td>${esc(t.desc)}<span class="tag">${esc(t.cat)} · ${d}</span></td>
      <td class="v ${t.tipo === "entrada" ? "pos" : "neg"}">${sinal} ${brl(t.valor)}</td>
      <td class="x"><button class="del" data-id="${t.id}" title="Remover">✕</button></td></tr>`;
              })
              .join("")
          : '<tr><td class="vazio">Nenhuma transação no período.</td></tr>';
      }

      $("#f").addEventListener("submit", (e) => {
        e.preventDefault();
        const valor = parseFloat($("#val").value);
        if (!(valor > 0)) return;
        tx.push({
          id: Date.now(),
          desc: $("#desc").value.trim(),
          valor,
          tipo: $("#tipo").value,
          cat: $("#cat").value,
          data: $("#data").value,
        });
        save();
        $("#desc").value = "";
        $("#val").value = "";
        $("#mes").value = $("#data").value.slice(0, 7);
        render();
      });
      $("#lista").addEventListener("click", (e) => {
        const id = e.target.dataset.id;
        if (!id) return;
        tx = tx.filter((t) => String(t.id) !== id);
        save();
        render();
      });
      $("#mes").addEventListener("input", render);
      $("#todos").addEventListener("click", () => {
        $("#mes").value = "";
        render();
      });
      $("#csv").addEventListener("click", () => {
        const linhas = [
          "data;descricao;categoria;tipo;valor",
          ...tx.map((t) =>
            [
              t.data,
              '"' + t.desc.replace(/"/g, '""') + '"',
              t.cat,
              t.tipo,
              t.valor.toFixed(2).replace(".", ","),
            ].join(";"),
          ),
        ];
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob(["\ufeff" + linhas.join("\n")], {
            type: "text/csv;charset=utf-8",
          }),
        );
        a.download = "financas.csv";
        a.click();
      });
      render();
    </script>
  </body>
</html>
